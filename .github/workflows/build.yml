name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-cli:
    name: Build Multi-Platform CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download Go dependencies
        run: go mod download

      - name: Build binaries
        run: make build

      - name: Archive CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filerecova-cli-binaries
          path: bin/*

  build-windows-gui:
    name: Build Windows 11 GUI Executable
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Build FileRecovaGUI executable
        run: |
          go build -tags desktop,production -ldflags "-H windowsgui -s -w" -o bin/FileRecovaGUI.exe .
          go build -ldflags "-s -w" -o bin/FileRecovaCLI.exe cmd/main.go

      - name: Archive Windows GUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filerecova-windows-gui
          path: bin/*.exe
