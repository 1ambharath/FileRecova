name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'release/v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Multi-Platform Release Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Build Windows GUI & CLI Binaries
        run: |
          mkdir -p bin
          go build -tags desktop,production -ldflags "-H windowsgui -s -w" -o bin/FileRecovaGUI-windows-amd64.exe .
          go build -ldflags "-s -w" -o bin/FileRecovaCLI-windows-amd64.exe cmd/main.go

      - name: Create GitHub Release and attach binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: FileRecova ${{ github.ref_name }}
          files: |
            bin/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
