<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="700" height="180" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Shield / Disk Graphic Group -->
  <g transform="translate(45, 25)">
    <!-- Outer Glow Shield -->
    <path d="M65 10 L115 30 L115 80 C115 110 65 125 65 125 C65 125 15 110 15 80 L15 30 Z" 
          fill="none" stroke="url(#glowGrad)" stroke-width="3" filter="url(#glow)" opacity="0.6"/>
    
    <!-- Core Shield -->
    <path d="M65 10 L115 30 L115 80 C115 110 65 125 65 125 C65 125 15 110 15 80 L15 30 Z" 
          fill="#1e1e38" stroke="url(#brandGrad)" stroke-width="3.5" />

    <!-- Storage Platter / Recovery Rings -->
    <circle cx="65" cy="65" r="32" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.8" />
    <circle cx="65" cy="65" r="20" fill="none" stroke="#818cf8" stroke-width="2" />
    <circle cx="65" cy="65" r="8" fill="url(#brandGrad)" />

    <!-- Upward Recovery Arrow / Spark -->
    <path d="M65 42 L65 72 M57 52 L65 42 L73 52" 
          fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography -->
  <!-- Main Title -->
  <text x="195" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    File<tspan fill="url(#brandGrad)">Recova</tspan>
  </text>

  <!-- Tagline / Subtitle -->
  <text x="198" y="125" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="15" font-weight="600" fill="#94a3b8" letter-spacing="3.5">
    FORENSIC DISK ANALYSIS &amp; RECOVERY
  </text>

  <!-- Status / Windows 11 Badge -->
  <rect x="540" y="32" width="125" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
  <text x="602" y="49" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.8">
    WINDOWS 11
  </text>
</svg>

